name: ZYRO 360 - Chat privacy and unread checks
on:
  push:
    branches: [feat/zyro-chat-unread-clear-20261031]
    paths: ['chat-view-core.mjs','server.mjs','public/app.js','public/index.html','public/zyro-chat-*','test/chat-view.test.mjs','.github/workflows/chat-privacy.yml']
  pull_request:
    paths: ['chat-view-core.mjs','server.mjs','public/app.js','public/index.html','public/zyro-chat-*','test/chat-view.test.mjs','.github/workflows/chat-privacy.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check public/zyro-chat-notifications-v1.js
      - run: node --test test/chat-view.test.mjs
