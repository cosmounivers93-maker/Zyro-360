name: ZYRO 360 - Controlli Accompagnami v72
on:
  push:
    branches: ['fix/zyro-journey-visible-svg-pin-v77','main']
    paths: ['public/app.js','public/index.html','public/zyro-journey-v71.css','tests/journey-controls-v72.test.mjs','tests/journey-marker-browser-smoke.mjs','.github/workflows/journey-controls-v72.yml']
  pull_request:
    branches: [main]
    paths: ['public/app.js','public/index.html','public/zyro-journey-v71.css','tests/journey-controls-v72.test.mjs','tests/journey-marker-browser-smoke.mjs','.github/workflows/journey-controls-v72.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica sintassi app e test
        run: |
          node --check public/app.js
          node --test tests/journey-controls-v72.test.mjs
      - name: Verifica controlli esistenti
        run: |
          node --test tests/journey-consent-v71.test.mjs
      - name: Verifica puntino viola effettivamente visibile in browser
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node tests/journey-marker-browser-smoke.mjs
      - name: Conserva screenshot segnaposto viola
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zyro-journey-violet-pin-visual-test
          path: zyro-journey-destination-browser-smoke.png
          if-no-files-found: ignore
