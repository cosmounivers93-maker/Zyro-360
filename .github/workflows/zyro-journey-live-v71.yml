name: ZYRO 360 - Verifica Render e funzioni online correnti
on:
  push:
    branches: [main, fix/render-live-check-current-release-20261108]
    paths:
      - 'public/app.js'
      - 'public/index.html'
      - 'public/zyro-journey-v71.css'
      - 'server.mjs'
      - '.github/workflows/zyro-journey-live-v71.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ottieni versione prevista dal repository corrente
        uses: actions/checkout@v4
      - name: Controlla Render e la versione pubblicata senza controlli v79 obsoleti
        shell: bash
        run: |
          set -euo pipefail
          base='https://zyro-360.onrender.com'
          expected_js="$(grep -oE '/app\.js\?v=[0-9.]+' public/index.html | head -n 1)"
          if [[ -z "$expected_js" ]]; then
            echo "::error::Versione app.js non specificata nel repository."
            exit 1
          fi
          echo "Versione JS attesa: $expected_js"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 3 --max-time 28 "$base/" -o /tmp/zyro-live-index.html &&
               curl --fail --silent --show-error --location --retry 2 --retry-delay 3 --max-time 28 "$base$expected_js" -o /tmp/zyro-live-app.js &&
               curl --fail --silent --show-error --location --retry 2 --retry-delay 3 --max-time 28 "$base/api/health" -o /tmp/zyro-health.json; then
              if grep -Fq "$expected_js" /tmp/zyro-live-index.html &&
                 grep -Fq 'id="journeyDueAt"' /tmp/zyro-live-index.html &&
                 grep -Fq 'id="journeyArrived"' /tmp/zyro-live-index.html &&
                 grep -Fq 'id="journeyCancel"' /tmp/zyro-live-index.html &&
                 grep -Fq 'id="zyroGroupCodeJoinForm"' /tmp/zyro-live-index.html &&
                 grep -Fq 'id="zyroUnicoTitle"' /tmp/zyro-live-index.html &&
                 grep -Fq 'SOS rapido' /tmp/zyro-live-index.html &&
                 grep -Fq 'Navigazione SOS' /tmp/zyro-live-index.html &&
                 grep -Fq 'journeyPreviewPositionLocked' /tmp/zyro-live-app.js &&
                 grep -Fq 'function positionJourneyPreviewDialog()' /tmp/zyro-live-app.js &&
                 grep -Fq "post('/api/circles/group-code/join'" /tmp/zyro-live-app.js &&
                 node -e "const h=require('/tmp/zyro-health.json');if(!h.ok||!h.persistentStorage)process.exit(1)"; then
                # Requests without login must not access sensitive data or send an SOS.
                state_code="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$base/api/state")"
                sos_code="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$base/api/sos/start")"
                code_join_code="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$base/api/circles/group-code/join")"
                if [[ "$state_code" == 401 && "$sos_code" == 401 && "$code_join_code" == 401 ]]; then
                  echo "SUCCESS: Render attivo, database persistente, $expected_js pubblicata, Accompagnami/SOS/Gruppi/Abbonamento e accessi protetti."
                  echo "NOTE: il test HTTP non certifica la consegna push, il GPS o le autorizzazioni Android."
                  exit 0
                fi
                echo "Sicurezza HTTP non confermata: state=$state_code sos=$sos_code group=$code_join_code"
              fi
            fi
            echo "Render non espone ancora le caratteristiche attese (tentativo $attempt/40)."
            sleep 8
          done
          echo "::error::Versione Render o funzionalità richieste non confermate: verificare il deploy e i log."
          exit 1
