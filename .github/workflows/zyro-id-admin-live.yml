name: ZYRO 360 - Verifica inviti ID e admin realmente pubblicati
on:
  push:
    branches: [main]
    paths:
      - 'server.mjs'
      - 'public/index.html'
      - 'public/app.js'
      - '.github/workflows/zyro-id-admin-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verifica frontend originale e backend su Render
        shell: bash
        run: |
          set -euo pipefail
          base='https://zyro-360.onrender.com'
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --location --max-time 20 "$base/" -o /tmp/zyro-index.html \
             && curl --fail --silent --show-error --location --max-time 20 "$base/app.js?v=80.1" -o /tmp/zyro-app.js \
             && curl --fail --silent --show-error --location --max-time 20 "$base/api/health" -o /tmp/zyro-health.json \
             && grep -Fq 'id="sendProfileInviteForm"' /tmp/zyro-index.html \
             && grep -Fq 'id="profileIncomingInvites"' /tmp/zyro-index.html \
             && grep -Fq 'id="zyroAdminOverview"' /tmp/zyro-index.html \
             && grep -Fq 'id="avatarGallery"' /tmp/zyro-index.html \
             && ! grep -Fq 'id="avatarCamera"' /tmp/zyro-index.html \
             && grep -Fq 'function renderProfileInvites()' /tmp/zyro-app.js \
             && grep -Fq "consentSosAudio:kind==='audio'&&target.checked" /tmp/zyro-app.js \
             && node -e "const h=require('/tmp/zyro-health.json');if(!h.ok||!h.persistentStorage)process.exit(1)"; then
              invitecode=$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/profile-invites")
              admincode=$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/admin/overview")
              if [ "$invitecode" = '404' ] && [ "$admincode" = '401' ]; then
                echo 'SUCCESS: originale Zyro Online, ID invite + admin only owner, stable PostgreSQL.'
                exit 0
              fi
              echo "Backend auth status: profile-invites=$invitecode admin=$admincode"
            fi
            echo "Nuovo frontend/backend non ancora confermato su Render ($attempt/48)"
            sleep 8
          done
          echo 'FAIL: GitHub aggiornato ma Render non espone la versione originale con ID e admin.'
          exit 1
