name: ZYRO 360 - Cerchie singole, gruppi 20 e selettore Accompagnami
on:
  push:
    branches: ['feature/zyro-cerchie-singole-gruppo-picker-20261106']
  pull_request:
    paths:
      - 'server.mjs'
      - 'public/app.js'
      - 'public/index.html'
      - 'public/zyro-circle-modes-v2.css'
      - 'tests/**'
      - 'test/**'
      - '.github/workflows/zyro-circle-modes-v2.yml'
permissions:
  contents: read
jobs:
  verify-circles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Sintassi server e UI
        run: |
          node --check server.mjs
          node --check public/app.js
      - name: Test richieste ID e cerchie singole autenticate
        run: node --test tests/profile-id-invites-owner-original-ui.test.mjs
      - name: Test completo
        run: npm test
