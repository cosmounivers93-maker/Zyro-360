name: ZYRO 360 - Billing unit tests
on:
  push:
    paths:
      - 'play-billing.mjs'
      - 'test/**'
      - '.github/workflows/billing-tests.yml'
  pull_request:
    paths:
      - 'play-billing.mjs'
      - 'test/**'
      - '.github/workflows/billing-tests.yml'
jobs:
  billing-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/play-billing-products.test.mjs
