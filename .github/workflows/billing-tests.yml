name: ZYRO 360 - Billing unit tests
on:
  push:
    paths:
      - 'play-billing.mjs'
      - 'test/**'
      - '.github/workflows/billing-tests.yml'
  pull_request:
    paths:
      - 'play-billing.mjs'
      - 'test/**'
      - '.github/workflows/billing-tests.yml'
jobs:
  billing-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm billing exports and server syntax
        run: |
          node --check server.mjs
          node --input-type=module -e "import {PlayBilling,PlayRepository,GooglePlayApi,createTokenCipher,accountId,PACKAGE} from './play-billing.mjs'; if(!PlayBilling || !PlayRepository || !GooglePlayApi || !createTokenCipher || !accountId || !PACKAGE)process.exit(1);"
      - run: node --test test/play-billing-products.test.mjs
