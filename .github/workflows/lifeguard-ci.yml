name: LifeGuard 360 - Test sicurezza e interfaccia
on:
  pull_request:
    paths:
      - 'server.mjs'
      - 'public/**'
      - 'test/lifeguard-v1.test.mjs'
      - '.github/workflows/lifeguard-ci.yml'
  push:
    branches: ['feature/lifeguard-360']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Controlla sintassi
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check public/zyro-lifeguard-v1.js
      - name: Esegui test
        run: npm test
