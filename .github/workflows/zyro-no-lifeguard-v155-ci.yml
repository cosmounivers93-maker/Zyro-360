name: Zyro v155 - Accompagnami e Check-in autonomi
on:
  push:
    branches: ['feature/remove-lifeguard-section-v155']
  pull_request:
    paths:
      - 'server.mjs'
      - 'public/**'
      - 'test/lifeguard-v1.test.mjs'
permissions:
  contents: read
jobs:
  full-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica sintassi e sicurezza
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check public/zyro-journey-address-v1.js
          test ! -e public/zyro-lifeguard-v1.js
          test ! -e public/zyro-lifeguard-v1.css
          ! grep -qi 'LifeGuard' public/index.html
          ! grep -qi 'LifeGuard' public/app.js
          ! grep -qi 'rilevamento cadute' public/index.html
      - name: Installa dipendenze
        run: npm install --no-audit --no-fund
      - name: Test completo
        run: npm test
