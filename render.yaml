# Solo per prototipo dimostrativo, non adatto alla sicurezza personale in produzione.
# Render Free sospende il servizio e perde i dati locali ai riavvii.
services:
  - type: web
    name: zyro-360
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
